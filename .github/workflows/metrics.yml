name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: General stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics-header.svg
          base: header, activity, community, repositories
          config_timezone: Europe/Kyiv
          extras_js: |
            const find = text => [...document.querySelectorAll(".field")].find(el => el.textContent.includes(text));
            const header = find("Joined GitHub")?.closest(".items-wrapper > section");
            for (const [text, title] of [["Joined GitHub", "Community stats"], ["Contributed to", "Activity"]]) {
              const el = find(text), heading = find(title);
              if (el && heading) heading.after(el);
            }
            header?.remove();

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics-langs.svg
          base: ""
          config_timezone: Europe/Kyiv
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          extras_js: |
            const subtitle = document.querySelector(".column > h3");
            if (subtitle) Object.assign(subtitle.style, {alignSelf: "flex-start", color: "inherit"});
