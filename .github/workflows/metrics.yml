name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: General stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics-header.svg
          base: header, activity, community, repositories
          config_timezone: Europe/Kyiv
          extras_js: |
            for (const el of document.querySelectorAll("h1.field, .field.calendar")) el.remove();

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics-langs.svg
          base: ""
          config_timezone: Europe/Kyiv
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
